<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Test API Tester</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 20px; 
            max-width: 700px; 
            margin: auto; 
            background-color: #f9fafb;
            color: #333;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="number"] { 
            width: 100%; 
            padding: 10px; 
            box-sizing: border-box; 
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button { 
            padding: 10px 20px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 4px;
            cursor: pointer; 
            font-weight: bold;
            width: 100%;
        }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        pre { 
            background-color: #1f2937; 
            color: #10b981;
            padding: 15px; 
            overflow-x: auto; 
            border-radius: 4px;
            min-height: 100px;
        }
        #status { font-weight: bold; margin-bottom: 10px; }
        .error { color: #dc2626; }
        .success { color: #16a34a; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🧪 Test 'generateWeeklyTest' API</h2>

        <div class="form-group">
            <label for="apiUrl">API Endpoint URL:</label>
            <!-- Change 3000 to whatever port your Express server is running on -->
            <input type="text" id="apiUrl" value="http://localhost:3000/api/teacher/weekly-test">
        </div>

        <div class="form-group">
            <label for="subject">Subject:</label>
            <input type="text" id="subject" placeholder="e.g., Computer Science" value="Computer Science">
        </div>

        <div class="form-group">
            <label for="chapterId">Chapter ID (Must exist in your database):</label>
            <input type="number" id="chapterId" placeholder="e.g., 1" value="1">
        </div>

        <div class="form-group">
            <label for="totalMarks">Total Marks:</label>
            <input type="number" id="totalMarks" placeholder="e.g., 20" value="20">
        </div>

        <button id="generateBtn" onclick="testAPI()">Generate Weekly Test</button>

        <h3 style="margin-top: 30px;">Server Response:</h3>
        <div id="status">Waiting to start...</div>
        <pre id="output">No data yet...</pre>
    </div>

    <script>
        async function testAPI() {
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('status');
            const output = document.getElementById('output');

            const apiUrl = document.getElementById('apiUrl').value;
            const subject = document.getElementById('subject').value;
            const chapterId = document.getElementById('chapterId').value;
            const totalMarks = document.getElementById('totalMarks').value;

            // UI update: disable button and show loading state
            btn.disabled = true;
            status.innerHTML = "⏳ Sending request to server... AI is generating.";
            status.className = "";
            output.textContent = "";

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        subject: subject,
                        chapterId: parseInt(chapterId),
                        totalMarks: parseInt(totalMarks),
                        userInfo: { id: 3, role: "teacher" } // Mocked user info to prevent crash
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `HTTP Error ${response.status}`);
                }

                // UI update: Success
                status.innerHTML = "✅ Success!";
                status.className = "success";
                // Pretty-print the JSON output
                output.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                console.error("Fetch Error:", error);
                
                // UI update: Error
                status.innerHTML = "❌ Error occurred. Check your server terminal!";
                status.className = "error";
                output.textContent = error.message;
            } finally {
                // Re-enable button
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
