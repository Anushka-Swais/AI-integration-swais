<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGS Faculty - Lesson Planner Test</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1e1e2e; color: #cdd6f4; padding: 20px; display: flex; gap: 20px; }
        .panel { background: #313244; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); flex: 1; }
        h2 { margin-top: 0; color: #89b4fa; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #a6adc8; }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #45475a; border-radius: 4px; box-sizing: border-box; background: #181825; color: #cdd6f4; }
        button { background-color: #89b4fa; color: #11111b; font-size: 16px; cursor: pointer; border: none; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #74c7ec; }
        #downloadBtn { background-color: #a6e3a1; display: none; margin-top: 15px; }
        #downloadBtn:hover { background-color: #94e2d5; }
        pre { background: #11111b; color: #a6adc8; padding: 15px; border-radius: 4px; overflow-x: auto; min-height: 400px; white-space: pre-wrap; border: 1px solid #45475a; }
        .loading { display: none; color: #f9e2af; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div class="panel">
        <h2>📚 AI Lesson Planner</h2>
        <form id="lessonForm">
            <label for="chapterId">Chapter ID:</label>
            <input type="number" id="chapterId" value="101" required>

            <label for="topic">Topic / Chapter Name:</label>
            <input type="text" id="topic" value="Magnetic Effects of Electric Current" required>

            <label for="classLevel">Class Level:</label>
            <select id="classLevel" required>
                <option value="Class 8">Class 8</option>
                <option value="Class 9">Class 9</option>
                <option value="Class 10" selected>Class 10</option>
            </select>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" value="Physics" required>

            <label for="durationMinutes">Duration (Minutes):</label>
            <input type="number" id="durationMinutes" value="45" required>

            <button type="submit">Generate Lesson Plan</button>
            <div class="loading" id="loadingIndicator">🧠 AI is thinking... Please wait.</div>
        </form>
    </div>

    <div class="panel">
        <h2>📝 AI Output</h2>
        <pre id="responseOutput">Fill out the form and hit "Generate" to see the magic happen...</pre>
        <button id="downloadBtn">⬇️ Download Lesson Plan (.txt)</button>
    </div>

    <script>
        let generatedContent = "";

        document.getElementById('lessonForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const outputArea = document.getElementById('responseOutput');
            const loader = document.getElementById('loadingIndicator');
            const submitBtn = document.querySelector('button[type="submit"]');
            const downloadBtn = document.getElementById('downloadBtn');
            
            const payload = {
                chapterId: parseInt(document.getElementById('chapterId').value),
                topic: document.getElementById('topic').value,
                classLevel: document.getElementById('classLevel').value,
                subject: document.getElementById('subject').value,
                durationMinutes: parseInt(document.getElementById('durationMinutes').value),
                userInfo: { id: 3, name: "Anushka" } 
            };

            outputArea.textContent = "";
            loader.style.display = 'block';
            submitBtn.disabled = true;
            downloadBtn.style.display = 'none';

            try {
                // Pointing to your local port 5000 and the exact teacher route!
                const API_URL = 'http://localhost:5000/api/v1/ai/teacher/lesson-plan'; 

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.error) {
                    outputArea.textContent = "Error: " + data.error + "\nDetails: " + (data.details || "");
                } else {
                    generatedContent = data.lessonPlan;
                    outputArea.textContent = generatedContent;
                    downloadBtn.style.display = 'block'; 
                }
            } catch (error) {
                console.error("Error:", error);
                outputArea.textContent = "Request Failed. Is your Node.js backend running?\n\nError: " + error.message;
            } finally {
                loader.style.display = 'none';
                submitBtn.disabled = false;
            }
        });

        // Download Logic
        document.getElementById('downloadBtn').addEventListener('click', function() {
            const blob = new Blob([generatedContent], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `SGS_LessonPlan_${document.getElementById('topic').value.replace(/\s+/g, '_')}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
