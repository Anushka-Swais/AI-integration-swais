<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAIS Sleek Lesson Planner Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e; /* Matches your dark background */
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        /* --- LEFT PANEL: THE FORM UI --- */
        .planner-card {
            background: #ffffff;
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .alert-banner {
            background-color: #f0f4ff;
            border: 1px solid #d6e4ff;
            color: #4a6ee0;
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .alert-banner span.view-result {
            color: #6b8cff;
            font-size: 13px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .header-title h3 {
            margin: 0;
            font-size: 18px;
            color: #111;
        }

        .header-subtitle {
            font-size: 12px;
            color: #888;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            margin-top: 16px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: #8b5cf6;
        }

        /* Duration Slider Styling */
        .slider-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .duration-label { margin-top: 0; }
        
        .duration-value {
            background: #f0f4ff;
            color: #4a6ee0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #8b5cf6;
            margin-top: 10px;
        }

        .slider-marks {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #999;
            margin-top: 4px;
            padding: 0 5px;
        }

        .add-btn {
            color: #6c5ce7;
            font-size: 13px;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6c5ce7 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 24px;
            transition: opacity 0.2s;
        }

        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* --- RIGHT PANEL: OUTPUT & DOWNLOAD --- */
        .output-panel {
            background: #2a2a40;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            padding: 24px;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        .output-panel h3 { margin-top: 0; color: #fff; }

        pre {
            background: #1e1e2f;
            padding: 15px;
            border-radius: 8px;
            color: #00d2d3;
            overflow-x: auto;
            white-space: pre-wrap;
            flex-grow: 1;
            border: 1px solid #444;
            font-size: 13px;
            min-height: 400px;
        }

        .download-btn {
            background-color: #00b894;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .download-btn:hover { background-color: #009688; }
    </style>
</head>
<body>

    <!-- LEFT PANEL: UI FORM -->
    <div class="planner-card">
        <div class="alert-banner">
            <span>✨ Your last generated plan is ready</span>
            <span class="view-result">View result ></span>
        </div>

        <div class="header-title">
            <span style="background: #8b5cf6; color: white; padding: 4px 8px; border-radius: 6px; font-size: 14px;">📝</span>
            <h3>Plan Details</h3>
        </div>
        <div class="header-subtitle">Fill in the details below</div>

        <form id="plannerForm">
            <!-- 🚨 IMPORTANT: Value must match an actual ID in your local DB -->
            <label>Chapter *</label>
            <select id="chapterId" required>
                <option value="1">Chapter 4 - The Colonial Era in India (ID: 1)</option>
                <option value="2">Chapter 1 - Natural Resources (ID: 2)</option>
                <!-- Add your actual local DB chapter IDs here to test -->
            </select>

            <label>Specific Topic (optional)</label>
            <input type="text" id="topic" placeholder="e.g. Preamble and Fundamental Rights">

            <div style="margin-top: 20px;">
                <div class="slider-container">
                    <label class="duration-label">Duration</label>
                    <span class="duration-value" id="durationDisplay">45 min</span>
                </div>
                <input type="range" id="duration" min="30" max="90" step="15" value="45">
                <div class="slider-marks">
                    <span>30 min</span>
                    <span>60 min</span>
                    <span>90 min</span>
                </div>
            </div>

            <label>Custom Objectives (or leave blank for AI defaults)</label>
            <div id="objectivesContainer">
                <input type="text" class="objective-input" placeholder="Objective 1">
            </div>
            <button type="button" class="add-btn" id="addObjectiveBtn">+ Add objective</button>

            <label>Special Notes (optional)</label>
            <textarea id="specialNotes" rows="3" placeholder="e.g. Include a debate activity, focus on rural students' context..."></textarea>

            <button type="submit" class="submit-btn" id="generateBtn">✨ Generate with AI ✨</button>
        </form>
    </div>

    <!-- RIGHT PANEL: PREVIEW & DOWNLOAD -->
    <div class="output-panel">
        <h3>Backend Response Preview</h3>
        <button id="downloadBtn" class="download-btn">📥 Download Lesson Plan (.md)</button>
        <pre id="responseOutput">Configure the sleek UI on the left and hit "Generate with AI" to test your backend...</pre>
    </div>

    <script>
        let generatedText = ""; 

        // Update Slider Text dynamically
        const durationSlider = document.getElementById('duration');
        const durationDisplay = document.getElementById('durationDisplay');
        durationSlider.addEventListener('input', (e) => {
            durationDisplay.textContent = `${e.target.value} min`;
        });

        // Add extra objective fields dynamically
        document.getElementById('addObjectiveBtn').addEventListener('click', () => {
            const container = document.getElementById('objectivesContainer');
            const inputCount = container.querySelectorAll('input').length + 1;
            const newInput = document.createElement('input');
            newInput.type = 'text';
            newInput.className = 'objective-input';
            newInput.placeholder = `Objective ${inputCount}`;
            newInput.style.marginTop = '10px';
            container.appendChild(newInput);
        });

        // Form Submit Handler
        document.getElementById('plannerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const outputArea = document.getElementById('responseOutput');
            const generateBtn = document.getElementById('generateBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            
            // Gather all custom objectives into a single string
            const objectives = Array.from(document.querySelectorAll('.objective-input'))
                                   .map(input => input.value)
                                   .filter(val => val.trim() !== '')
                                   .join('; ');

            // Build Payload
            const payload = {
                chapterId: document.getElementById('chapterId').value,
                topic: document.getElementById('topic').value,
                durationMinutes: document.getElementById('duration').value,
                // Passing your UI notes to the backend variables
                customObjectives: objectives, 
                teacherInstructions: document.getElementById('specialNotes').value,
                userInfo: { id: 3, name: "SWAIS Faculty" }
            };

            // UI feedback
            outputArea.textContent = "Connecting to AI... Please wait.";
            generateBtn.disabled = true;
            generateBtn.textContent = "Generating...";
            downloadBtn.style.display = 'none';

            try {
                // 🚨 Pointing to port 5000 based on your .env settings 🚨
                const API_URL = 'http://localhost:5000/api/lesson-plan'; 

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error || "Unknown error occurred.");

                // Display response
                generatedText = data.lessonPlan;
                outputArea.textContent = generatedText;
                downloadBtn.style.display = 'block';

            } catch (error) {
                console.error("Error:", error);
                outputArea.textContent = "❌ Request Failed.\n\nError Details: " + error.message;
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = "✨ Generate with AI ✨";
            }
        });

        // Download Logic
        document.getElementById('downloadBtn').addEventListener('click', function() {
            if (!generatedText) return;
            const blob = new Blob([generatedText], { type: 'text/markdown' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            
            // Generate a smart filename
            const topicName = document.getElementById('topic').value || 'Lesson_Plan';
            a.download = `${topicName.replace(/\s+/g, '_')}.md`; 
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
