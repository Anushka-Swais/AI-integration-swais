<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard - Exam Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
        }
        .panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex: 1;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            min-height: 400px;
        }
        .loading {
            display: none;
            color: #e67e22;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>Generate Exam / Notes</h2>
        <form id="examForm">
            <label for="examTarget">Exam Target:</label>
            <select id="examTarget" required>
                <option value="IIT JEE">IIT JEE</option>
                <option value="NEET">NEET</option>
                <option value="Olympiad">Olympiad</option>
                <option value="UPSC">UPSC</option>
            </select>

            <label for="classLevel">Class Level:</label>
            <select id="classLevel" required>
                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
            </select>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" placeholder="e.g., Physics, Maths, Biology" required>

            <label for="topic">Topic:</label>
            <input type="text" id="topic" placeholder="e.g., Kinematics: Velocity" required>

            <label for="contentType">Content Type:</label>
            <select id="contentType" required>
                <option value="MockTest">Mock Test</option>
                <option value="Quiz">Quiz</option>
                <option value="PracticeQuestions">Practice Questions</option>
                <option value="PrepMaterial">Preparation Material (Notes)</option>
            </select>

            <label for="totalMarks">Total Marks (For Exams):</label>
            <select id="totalMarks">
                <option value="20">20</option>
                <option value="30">30</option>
                <option value="50">50</option>
                <option value="70">70</option>
                <option value="100">100</option>
            </select>

            <label for="examDifficulty">Difficulty:</label>
            <select id="examDifficulty">
                <option value="Easy">Easy</option>
                <option value="Medium" selected>Medium</option>
                <option value="Hard">Hard</option>
            </select>

            <button type="submit">Generate Content</button>
            <div class="loading" id="loadingIndicator">Generating with AI... Please wait.</div>
        </form>
    </div>

    <div class="panel">
        <h2>Backend Response (JSON Preview)</h2>
        <pre id="responseOutput">Fill out the form and hit "Generate Content" to see the API response here...</pre>
    </div>

    <script>
        document.getElementById('examForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const outputArea = document.getElementById('responseOutput');
            const loader = document.getElementById('loadingIndicator');
            const submitBtn = document.querySelector('button[type="submit"]');
            
            // Build the payload
            const payload = {
                examTarget: document.getElementById('examTarget').value,
                classLevel: document.getElementById('classLevel').value,
                subject: document.getElementById('subject').value,
                topic: document.getElementById('topic').value,
                contentType: document.getElementById('contentType').value,
                totalMarks: document.getElementById('totalMarks').value,
                examDifficulty: document.getElementById('examDifficulty').value,
                userInfo: { userId: "faculty_123", role: "admin" }, // Mock user info
                scheduledDate: new Date().toISOString() // Mock date
            };

            // UI feedback
            outputArea.textContent = "";
            loader.style.display = 'block';
            submitBtn.disabled = true;

            try {
                // 🚨 IMPORTANT: Replace this URL with your actual local server URL 🚨
                const API_URL = 'http://localhost:5000/api/competitive/generate';

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                // Pretty print the JSON response
                outputArea.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                console.error("Error:", error);
                outputArea.textContent = "Request Failed. Make sure your Node.js backend is running and the API_URL in this script is correct.\n\nError Details: " + error.message;
            } finally {
                loader.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
